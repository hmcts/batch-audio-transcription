[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcription-svc"
version = "1.0.0"
description = "Batch audio transcription microservice for Azure Speech Services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4 lost bcrypt.__about__ in bcrypt 4.0 (trapped, non-fatal).
    # Pin to <5 so an unconstrained resolve can't pull in a bcrypt major that
    # may break hash/verify before passlib ships a compatible release.
    "bcrypt>=4.0,<5",
    "cryptography>=42.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "sentry-sdk[fastapi]>=2.0",
    "azure-storage-blob>=12.20",
    "azure-identity>=1.17",
    # Required async transport for azure.identity.aio / azure.storage.blob.aio —
    # DefaultAzureCredential's async pipeline raises ImportError without it
    # whenever no AZURE_STORAGE_CONNECTION_STRING is set (i.e. everywhere
    # except local dev), which silently breaks blob access including the
    # retention-policy cleanup in polling_service.py.
    "aiohttp>=3.9",
    "uwotm8>=0.1",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.14.5",
    "hmcts-fastapi-azure-auth",
    # Telemetry (DIAAT-205). Brings azure-monitor-opentelemetry and the FastAPI
    # instrumentation; configured in src/transcription_svc/telemetry.py.
    # 0.2.0 adds AI usage metering (record_speech_usage, OBS-5).
    "hmcts-otel[fastapi,sentry]>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "coverage>=7.0",
    "ruff>=0.4",
]

[tool.uv.sources]
hmcts-fastapi-azure-auth = { path = "./vendor/hmcts_fastapi_azure_auth-0.2.0-py3-none-any.whl" }
# TEMPORARY: vendored until hmcts/hmcts-otel is published to the hmcts-lib feed (OBS-1).
# 0.2.0 built from hmcts-otel commit 11a4c46, sha256 6e4ba515bf3e92a46d3a08417f66f88fa99a52839584f8fd6f8cf9bf1c5fccfd.
# The Dockerfile installs vendor/hmcts_otel-*.whl by glob, so only this line changes on upgrade.
hmcts-otel = { path = "./vendor/hmcts_otel-0.2.0-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src/transcription_svc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S603", "S607", "B008", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "migrations/*"]
